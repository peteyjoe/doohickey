[package]
name = "firmware"
version = "0.2.0"
edition = "2024"
publish = false

[features]
default = [] # 4 MiB flash
flash-16mb = []
insecure-test-otp = [] # Test only: plaintext flash emulation, never hardware OTP
otp-provisioning = [] # Explicit opt-in to irreversible hardware writes

[workspace]
members = ["src/crypto"]
default-members = ["."]
resolver = "3"

[[example]]
name = "otp_smoke"
required-features = ["insecure-test-otp"]

[dependencies]
doohickey-crypto = { path = "src/crypto" }
embassy-executor = { version = "0.10.0", features = ["defmt"] }
embassy-rp = { version = "0.10.0", features = ["rp235xa", "defmt", "time-driver", "critical-section-impl", "executor-thread", "binary-info"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-usb = { version = "0.6.0", default-features = false, features = ["defmt"] }
embassy-futures = "0.1.2"
cortex-m = { version = "0.7.7", features = ["inline-asm"] }
cortex-m-rt = "0.7.5"
defmt = "1.0.1"
defmt-rtt = "1.0.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
sequential-storage = "8.0.2"
zeroize = { version = "1.8", default-features = false }
rand_core = { version = "0.6.4", default-features = false }
subtle = { version = "2.6", default-features = false }
critical-section = "1.2"

[profile.dev]
opt-level = 1

[profile.release]
debug = 2
lto = "thin"
